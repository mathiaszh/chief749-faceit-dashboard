name: Check dashboard calculations
on:
  push:
    paths: ['dashboard/**', 'scripts/**', 'tests/**', '.github/workflows/dashboard-checks.yml']
  pull_request:
    paths: ['dashboard/**', 'scripts/**', 'tests/**', '.github/workflows/dashboard-checks.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test dashboard/tests/*.test.mjs
      - run: python -m unittest discover -s tests
